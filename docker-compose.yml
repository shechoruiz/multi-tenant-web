version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shelf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
      POSTGRES_DB: shelf
    volumes:
      - shelf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shelf-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shelf.app
      PGADMIN_DEFAULT_PASSWORD: shelf
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shelf-pgdata:
